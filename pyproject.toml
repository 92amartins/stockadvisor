[project]
name = "stockadvisor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.12",
    "gnews>=0.8.2",
    "langchain>=1.3.18",
    "langchain-ollama>=1.1.0",
    "yfinance>=1.7.0",
]

[project.scripts]
stockadvisor = "stockadvisor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]
